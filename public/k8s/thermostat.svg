    <line x1="120" y1="16" x2="120" y2="30" stroke="#9a9a9a" stroke-width="3" stroke-linecap="round" transform="rotate(315 120 120)" />
    <line x1="120" y1="16" x2="120" y2="24" stroke="#4a4a4a" stroke-width="2" stroke-linecap="round" transform="rotate(330 120 120)" />
    <line x1="120" y1="16" x2="120" y2="24" stroke="#4a4a4a" stroke-width="2" stroke-linecap="round" transform="rotate(345 120 120)" />
  <!-- actual reading: 19C, dimmer marker, slightly behind target -->
  <line x1="120" y1="120" x2="120" y2="34" stroke="#5a5a5a" stroke-width="3" stroke-linecap="round" transform="rotate(-20 120 120)" />
  <!-- desired/target reading: 21C, amber needle -->
  <line x1="120" y1="120" x2="120" y2="28" stroke="#e2a75a" stroke-width="4" stroke-linecap="round" transform="rotate(15 120 120)" />
  <circle cx="120" cy="120" r="7" fill="#e2a75a" />
  <circle cx="120" cy="120" r="62" fill="#111111" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  <text x="120" y="114" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="13" letter-spacing="0.08em" fill="#737373">TARGET</text>
  <text x="120" y="146" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="34" font-weight="500" fill="#e5e5e5">21&#176;C</text>
</svg>
