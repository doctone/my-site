<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="thermostatTitle" aria-describedby="thermostatDesc">
  <title id="thermostatTitle">A thermostat set to 21&#176;C</title>
  <desc id="thermostatDesc">A round wall thermostat. The dial is set to a target of 21 degrees, shown by the amber needle and readout; a dimmer marker shows the room is still at 19 degrees, still catching up to the target.</desc>
  <circle cx="120" cy="120" r="118" fill="#1a1a1a" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  <circle cx="120" cy="120" r="98" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <line x1="120" y1="16" x2="120" y2="30" stroke="#9a9a9a" stroke-width="3" stroke-linecap="round" transform="rotate(0 120 120)" />
    <line x1="120" y1="16" x2="120" y2="24" stroke="#4a4a4a" stroke-width="2" stroke-linecap="round" transform="rotate(15 120 120)" />
    <line x1="120" y1="16" x2="120" y2="24" stroke="#4a4a4a" stroke-width="2" stroke-linecap="round" transform="rotate(30 120 120)" />
    <line x1="120" y1="16" x2="120" y2="30" stroke="#9a9a9a" stroke-width="3" stroke-linecap="round" transform="rotate(45 120 120)" />
    <line x1="120" y1="16" x2="120" y2="24" stroke="#4a4a4a" stroke-width="2" stroke-linecap="round" transform="rotate(60 120 120)" />
    <line x1="120" y1="16" x2="120" y2="24" stroke="#4a4a4a" stroke-width="2" stroke-linecap="round" transform="rotate(75 120 120)" />
    <line x1="120" y1="16" x2="120" y2="30" stroke="#9a9a9a" stroke-width="3" stroke-linecap="round" transform="rotate(90 120 120)" />
    <line x1="120" y1="16" x2="120" y2="24" stroke="#4a4a4a" stroke-width="2" stroke-linecap="round" transform="rotate(105 120 120)" />
    <line x1="120" y1="16" x2="120" y2="24" stroke="#4a4a4a" stroke-width="2" stroke-linecap="round" transform="rotate(120 120 120)" />
    <line x1="120" y1="16" x2="120" y2="30" stroke="#9a9a9a" stroke-width="3" stroke-linecap="round" transform="rotate(135 120 120)" />
    <line x1="120" y1="16" x2="120" y2="24" stroke="#4a4a4a" stroke-width="2" stroke-linecap="round" transform="rotate(150 120 120)" />
    <line x1="120" y1="16" x2="120" y2="24" stroke="#4a4a4a" stroke-width="2" stroke-linecap="round" transform="rotate(165 120 120)" />
    <line x1="120" y1="16" x2="120" y2="30" stroke="#9a9a9a" stroke-width="3" stroke-linecap="round" transform="rotate(180 120 120)" />
    <line x1="120" y1="16" x2="120" y2="24" stroke="#4a4a4a" stroke-width="2" stroke-linecap="round" transform="rotate(195 120 120)" />
    <line x1="120" y1="16" x2="120" y2="24" stroke="#4a4a4a" stroke-width="2" stroke-linecap="round" transform="rotate(210 120 120)" />
    <line x1="120" y1="16" x2="120" y2="30" stroke="#9a9a9a" stroke-width="3" stroke-linecap="round" transform="rotate(225 120 120)" />
    <line x1="120" y1="16" x2="120" y2="24" stroke="#4a4a4a" stroke-width="2" stroke-linecap="round" transform="rotate(240 120 120)" />
    <line x1="120" y1="16" x2="120" y2="24" stroke="#4a4a4a" stroke-width="2" stroke-linecap="round" transform="rotate(255 120 120)" />
    <line x1="120" y1="16" x2="120" y2="30" stroke="#9a9a9a" stroke-width="3" stroke-linecap="round" transform="rotate(270 120 120)" />
    <line x1="120" y1="16" x2="120" y2="24" stroke="#4a4a4a" stroke-width="2" stroke-linecap="round" transform="rotate(285 120 120)" />
